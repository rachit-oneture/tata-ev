services:
  - type: web
    name: tata-ev-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
